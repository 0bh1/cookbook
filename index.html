            :root { --ground:#FFFFFF; --band:#EEEEEB; --sheet:#F7F7F5; --line:#E3E2DE; --edge:#8F8E89; --ink:#121211; --ink-2:#4D4C48; --ink-3:#62615C; --ink-4:#73726D; --signal:#FF5C00; --signal-hover:#E85200; --signal-ring:rgba(255,92,0,.24); }
            * { box-sizing: border-box; }
            .staticrypt-html { height: 100%; }
            .staticrypt-body { min-height: 100%; margin: 0; background: var(--ground); color: var(--ink); font: 400 13px/1.45 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
            .staticrypt-content { min-height: 100vh; display: flex; flex-direction: column; }
            .fp-top { display: flex; align-items: center; height: 56px; padding: 0 clamp(16px, 3.2vw, 40px); box-shadow: 0 1px 0 var(--line); }
            .fp-wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; line-height: 1; letter-spacing: -.02em; }
            .fp-wordmark svg { width: 14px; height: 14px; }
            .staticrypt-page { width: 100%; max-width: 520px; margin: 0 auto; padding: 12vh clamp(16px, 3.2vw, 40px) 64px; }
            .staticrypt-title { margin: 0 0 10px; font-weight: 600; font-size: 40px; line-height: 1.05; letter-spacing: -.03em; }
            .staticrypt-instructions p:not(.staticrypt-title) { margin: 0 0 22px; font-size: 15px; line-height: 1.42; color: var(--ink-2); }
            .staticrypt-form { background: var(--sheet); padding: 0; }
            .fp-band { height: 42px; display: flex; align-items: flex-end; padding: 0 2px; background: var(--band); }
            .fp-tab { height: 36px; display: flex; align-items: center; padding: 0 14px; background: var(--sheet); font-weight: 500; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; }
            #staticrypt-form { padding: 20px 16px 24px; }
            .fp-label { display: block; padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid var(--line); font-weight: 500; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
            .staticrypt-password-container { position: relative; display: flex; align-items: center; height: 40px; margin: 0 0 16px; background: #fff; box-shadow: inset 0 0 0 1px var(--edge); }
            .staticrypt-password-container:focus-within { box-shadow: inset 0 0 0 1px var(--ink), 0 0 0 3px var(--signal-ring); }
            .staticrypt-form input[type="password"], .staticrypt-form input[type="text"] { flex: 1; min-width: 0; height: 100%; padding: 0 40px 0 12px; border: 0; background: none; outline: none; font: inherit; font-size: 15px; color: var(--ink); }
            .staticrypt-form input::placeholder { color: var(--ink-4); }
            .staticrypt-toggle-password-visibility { position: absolute; right: 10px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); opacity: .55; cursor: pointer; }
            label.staticrypt-remember { display: flex; align-items: center; gap: 10px; margin: 0 0 18px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
            .staticrypt-remember input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }
            .staticrypt-form .staticrypt-decrypt-button { height: 40px; padding: 0 22px; border: 0; background: #FF5C00; color: var(--ink); font: inherit; font-weight: 500; font-size: 15px; cursor: pointer; }
            .staticrypt-form .staticrypt-decrypt-button:hover { background: var(--signal-hover); }
            .staticrypt-form .staticrypt-decrypt-button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
            .staticrypt-hr { display: none; }
            .hidden { display: none !important; }
            .staticrypt-spinner-container { height: 100vh; display: flex; align-items: center; justify-content: center; }
            .staticrypt-spinner { width: 28px; height: 28px; border: 3px solid var(--band); border-top-color: var(--signal); animation: spin .8s linear infinite; }
            @keyframes spin { to { transform: rotate(360deg); } }
        </style>
